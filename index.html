<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>माझे बजेट</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 select-none">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-20 shadow flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">💰 माझे बजेट</h1>
      <p id="syncStatus" class="text-xs text-blue-100 flex items-center gap-1.5 mt-0.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> सिंक चालू
      </p>
    </div>
    <button type="button" onclick="downloadCSVReport()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-xs font-semibold border border-blue-400">
      📥 रिपोर्ट
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Summary Cards -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">हातची शिल्लक (Balance)</p>
        <p id="totalBalance" class="text-xl font-black text-blue-600 mt-1">₹0</p>
      </div>

      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">एकूण गुंतवणूक (Savings)</p>
        <p id="totalSavings" class="text-xl font-black text-indigo-600 mt-1">₹0</p>
      </div>

      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">निवडलेली जमा</p>
        <p id="totalIncome" class="text-base font-bold text-emerald-600 mt-0.5">₹0</p>
      </div>

      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">निवडलेला खर्च</p>
        <p id="totalExpense" class="text-base font-bold text-rose-600 mt-0.5">₹0</p>
      </div>
    </div>

    <!-- Search & Date Filters -->
    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <input type="text" id="searchInput" oninput="renderTransactions()" placeholder="काहीही शोधा (Mutual Fund, किराणा)..." 
             class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <div>
        <p class="text-[11px] font-semibold text-slate-500 mb-1">तारीख निवडा (Date Range):</p>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-400">या तारखेपासून (From)</label>
            <input type="date" id="startDate" onchange="renderTransactions()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
          </div>
          <div>
            <label class="block text-[10px] text-slate-400">या तारखेपर्यंत (To)</label>
            <input type="date" id="endDate" onchange="renderTransactions()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
          </div>
        </div>
      </div>

      <div class="flex gap-2 items-center">
        <select id="typeFilter" onchange="renderTransactions()" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
          <option value="all">सर्व नोंदी</option>
          <option value="expense">केवळ खर्च</option>
          <option value="income">केवळ जमा</option>
          <option value="saving">केवळ गुंतवणूक/बचत</option>
        </select>
        <button type="button" onclick="clearDateFilter()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium">
          रिसेट
        </button>
      </div>
    </div>

    <!-- Entry Form -->
    <form id="entryForm" onsubmit="handleFormSubmit(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg">
        <label class="text-center cursor-pointer">
          <input type="radio" name="transType" value="expense" checked class="peer sr-only" onchange="updateCategories()">
          <span class="block py-1.5 text-xs font-bold rounded-md peer-checked:bg-rose-500 peer-checked:text-white text-slate-600 transition">खर्च</span>
        </label>
        <label class="text-center cursor-pointer">
          <input type="radio" name="transType" value="income" class="peer sr-only" onchange="updateCategories()">
          <span class="block py-1.5 text-xs font-bold rounded-md peer-checked:bg-emerald-500 peer-checked:text-white text-slate-600 transition">जमा</span>
        </label>
        <label class="text-center cursor-pointer">
          <input type="radio" name="transType" value="saving" class="peer sr-only" onchange="updateCategories()">
          <span class="block py-1.5 text-xs font-bold rounded-md peer-checked:bg-indigo-600 peer-checked:text-white text-slate-600 transition">गुंतवणूक/बचत</span>
        </label>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">रक्कम (₹)</label>
          <input type="number" id="amount" required placeholder="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-base font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">वर्गवारी</label>
          <select id="category" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">माध्यम</label>
          <select id="mode" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none">
            <option value="UPI">UPI / GPay</option>
            <option value="Bank">बँक खात्यातून</option>
            <option value="Cash">रोख (Cash)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">तारीख</label>
          <input type="date" id="transDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-500 mb-1">तपशील / टीप</label>
        <input type="text" id="note" placeholder="उदा. किराणा, SIP..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit" class="w-full bg-blue-600 active:scale-95 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">
        नोंद सेव्ह करा
      </button>
    </form>

    <!-- History -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 px-1">नोंदींचा इतिहास</h2>
      <div id="txList" class="space-y-2"></div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkKzsCZ1XQzc5-Bf-aKNaKlss9r-jzn1WqiyMjKZ_qF1d4TJmFWK_Z9UuqHpAihb8S/exec";

    const expenseCategories = ["किराणा", "प्रवास/पेट्रोल", "जेवण/हॉटेल", "लाईट बिल/रिचार्ज", "कपडे/शॉपिंग", "औषधे", "इतर खर्च"];
    const incomeCategories = ["पगार (Salary)", "व्यवसाय (Business)", "भाडे", "व्याज", "इतर जमा"];
    const savingCategories = ["Mutual Fund / SIP", "शेअर्स (Stocks)", "FD / RD", "सोने (Gold)", "PPF / PF", "विमा (Insurance/LIC)", "इतर बचत"];

    function getStoredData(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || '[]');
      } catch (e) {
        return [];
      }
    }

    function setStoredData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    let transactions = getStoredData('budget_data');
    let pendingQueue = getStoredData('budget_pending');

    const todayStr = new Date().toISOString().slice(0, 10);
    try {
      document.getElementById('transDate').value = todayStr;
    } catch (e) {}

    function updateCategories() {
      const type = document.querySelector('input[name="transType"]:checked').value;
      const catSelect = document.getElementById('category');
      let cats = [];
      if (type === 'expense') cats = expenseCategories;
      else if (type === 'income') cats = incomeCategories;
      else if (type === 'saving') cats = savingCategories;

      catSelect.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function clearDateFilter() {
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      document.getElementById('typeFilter').value = 'all';
      document.getElementById('searchInput').value = '';
      renderTransactions();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const type = document.querySelector('input[name="transType"]:checked').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const mode = document.getElementById('mode').value;
      const date = document.getElementById('transDate').value;
      const note = document.getElementById('note').value.trim() || category;

      const record = {
        id: "TX_" + Date.now(),
        date: date,
        type: type,
        category: category,
        amount: amount,
        mode: mode,
        notes: note
      };

      transactions.unshift(record);
      pendingQueue.push(record);
      setStoredData('budget_data', transactions);
      setStoredData('budget_pending', pendingQueue);

      renderTransactions();
      e.target.reset();
      document.getElementById('transDate').value = todayStr;
      updateCategories();
      triggerSync();
    }

    // नोंद डिलीट करण्याचे फंक्शन
    async function deleteTransaction(id) {
      if (!confirm("ही नोंद नक्की डिलीट करायची आहे का?")) return;

      // १. स्थानिक मेमरीमधून हटवणे
      transactions = transactions.filter(t => t.id !== id);
      pendingQueue = pendingQueue.filter(t => t.id !== id);
      setStoredData('budget_data', transactions);
      setStoredData('budget_pending', pendingQueue);
      renderTransactions();

      // २. गुगल शीटवरून हटवणे
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-ping"></span> डिलीट होत आहे...`;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> नोंद डिलीट झाली`;
      } catch (err) {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400 inline-block"></span> सिंक एरर`;
      }
    }

    function renderTransactions() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let lifetimeIncome = 0;
      let lifetimeExpense = 0;
      let lifetimeSaving = 0;

      transactions.forEach(t => {
        if (t.type === 'income') lifetimeIncome += t.amount;
        else if (t.type === 'expense') lifetimeExpense += t.amount;
        else if (t.type === 'saving') lifetimeSaving += t.amount;
      });

      const netBalance = lifetimeIncome - (lifetimeExpense + lifetimeSaving);
      const balEl = document.getElementById('totalBalance');
      balEl.innerText = `₹${netBalance.toLocaleString('en-IN')}`;
      balEl.className = `text-xl font-black mt-1 ${netBalance >= 0 ? 'text-blue-600' : 'text-rose-600'}`;

      const filtered = transactions.filter(t => {
        const matchSearch = (t.category + t.notes + t.mode + t.amount).toLowerCase().includes(search);
        const matchType = typeFilter === 'all' || t.type === typeFilter;
        
        let matchDate = true;
        if (startDate && t.date < startDate) matchDate = false;
        if (endDate && t.date > endDate) matchDate = false;

        return matchSearch && matchType && matchDate;
      });

      let rangeIncome = 0;
      let rangeExpense = 0;
      let rangeSaving = 0;

      filtered.forEach(t => {
        if (t.type === 'income') rangeIncome += t.amount;
        else if (t.type === 'expense') rangeExpense += t.amount;
        else if (t.type === 'saving') rangeSaving += t.amount;
      });

      document.getElementById('totalIncome').innerText = `₹${rangeIncome.toLocaleString('en-IN')}`;
      document.getElementById('totalExpense').innerText = `₹${rangeExpense.toLocaleString('en-IN')}`;
      document.getElementById('totalSavings').innerText = `₹${rangeSaving.toLocaleString('en-IN')}`;

      const container = document.getElementById('txList');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white p-5 text-center text-xs text-slate-400 rounded-xl">कोणत्याही नोंदी आढळल्या नाहीत.</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        let badgeColor = 'text-rose-600';
        let sign = '-';
        let typeBadge = 'खर्च';

        if (t.type === 'income') {
          badgeColor = 'text-emerald-600';
          sign = '+';
          typeBadge = 'जमा';
        } else if (t.type === 'saving') {
          badgeColor = 'text-indigo-600';
          sign = '💼 ';
          typeBadge = 'बचत/गुंतवणूक';
        }

        return `
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
            <div class="flex-1 pr-2">
              <p class="font-bold text-sm text-slate-800">${t.notes}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">${t.date} • <span class="bg-slate-100 px-1 py-0.5 rounded text-slate-600">${t.mode}</span> • <span class="font-semibold text-slate-600">${typeBadge}</span> • ${t.category}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold ${badgeColor}">
                ${sign} ₹${t.amount.toLocaleString('en-IN')}
              </span>
              <button type="button" onclick="deleteTransaction('${t.id}')" title="डिलीट करा" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-lg active:bg-rose-50 text-sm">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function triggerSync() {
      if (!navigator.onLine || pendingQueue.length === 0) return;
      
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-ping"></span> अपलोड होत आहे...`;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'sync', records: pendingQueue })
        });
        pendingQueue = [];
        setStoredData('budget_pending', []);
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> सर्व डेटा सेव्ह झाला`;
      } catch (err) {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400 inline-block"></span> ऑफलाइन (डेटा फोनमध्ये आहे)`;
      }
    }

    function downloadCSVReport() {
      if (transactions.length === 0) {
        alert("नोंद उपलब्ध नाही!");
        return;
      }
      let csv = "ID,Tariqh,Prakar,Vargawari,Rakkam,Madhyam,Tip\n";
      transactions.forEach(t => {
        csv += `"${t.id}","${t.date}","${t.type}","${t.category}","${t.amount}","${t.mode}","${t.notes.replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Budget_Report_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    window.addEventListener('online', triggerSync);
    updateCategories();
    renderTransactions();
  </script>
</body>
</html>
